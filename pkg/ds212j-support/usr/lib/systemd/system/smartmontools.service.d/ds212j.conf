# DS-212j: keep smartd's state in RAM, see var-lib-smartmontools.mount
[Unit]
RequiresMountsFor=/var/lib/smartmontools

[Service]
# smartd's SMART ENABLE at startup turns the drives' automatic offline data collection back
# on, and these drives then leave standby by themselves: switch it off again once smartd runs.
ExecStartPost=/bin/sh -c 'for d in /dev/sd?; do /usr/sbin/ds212j-spindown "$$d"; done; true'
