# DS-212j: all nightly maintenance in one window, so the disks wake up once a night
# (instead of ~10 times). Override with a drop-in in /etc/systemd/system/systemd-tmpfiles-clean.timer.d/.
# An empty assignment clears ALL of the timer's triggers (OnBootSec, OnUnitActiveSec, ...),
# so it comes first and the ones to keep are set again afterwards.
[Timer]
OnCalendar=
OnBootSec=15min
OnCalendar=*-*-* 04:00:00
RandomizedDelaySec=0
